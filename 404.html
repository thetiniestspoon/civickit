<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CivicKit has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://civickit.github.io/">
<script>
  // Preserve the sub-path: /civickit/civiclens -> https://civickit.github.io/civiclens
  (function () {
    var p = location.pathname.replace(/^\/civickit/, '') || '/';
    location.replace('https://civickit.github.io' + p + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1;url=https://civickit.github.io/">
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:34rem;margin:15vh auto;padding:0 1.5rem;line-height:1.6;color:#0f172a}
  a{color:#1d4ed8}
  @media(prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}a{color:#93c5fd}}
</style>
</head>
<body>
  <h1>CivicKit has moved</h1>
  <p>CivicKit now lives at <a href="https://civickit.github.io/">civickit.github.io</a>. You should be redirected automatically.</p>
  <p>If nothing happens, follow the link above.</p>
</body>
</html>
